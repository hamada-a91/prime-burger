services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: /api
    image: ${COMPOSE_PROJECT_NAME:-landing}-frontend:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    volumes:
      - storage_public:/usr/share/nginx/html/storage:ro
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./backend
    image: ${COMPOSE_PROJECT_NAME:-landing}-api:prod
    restart: unless-stopped
    env_file: backend/.env
    volumes:
      - storage_public:/var/www/html/storage/app/public
      # Quellfotos für den Galerie-Seeder (php artisan db:seed), nur lesend.
      - ./material:/var/www/material:ro
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
  storage_public:
